name: Android APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
      - name: Test and assemble debug APK
        run: /tmp/gradle-8.10.2/bin/gradle testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: lean-bicycle-factory-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
